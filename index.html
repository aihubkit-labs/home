<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="AI Hub Kit — AI 产品导航中心" />
  <title>AI Hub Kit</title>
  <style>
    /* ═══════════════ 设计变量 ═══════════════ */
    :root {
      --bg: #f0f2f7;
      --bg-elevated: rgba(255,255,255,.72);
      --bg-card: rgba(255,255,255,.60);
      --text: #1a1d26;
      --text-soft: #4a5160;
      --text-muted: #8890a0;
      --border: rgba(255,255,255,.45);
      --border-strong: rgba(200,208,222,.6);
      --accent-1: #4f6ef7;
      --accent-2: #a855f7;
      --accent-3: #f97316;
      --shadow-sm: 0 2px 12px rgba(16,24,40,.06);
      --shadow-md: 0 8px 32px rgba(16,24,40,.10);
      --shadow-lg: 0 20px 56px rgba(16,24,40,.14), 0 8px 24px rgba(79,110,247,.08);
      --radius-xl: 32px;
      --radius-lg: 22px;
      --radius-md: 14px;
      --transition: .35s cubic-bezier(.22,1,.36,1);
    }
    [data-theme="dark"] {
      --bg: #090c10;
      --bg-elevated: rgba(18,22,30,.70);
      --bg-card: rgba(18,22,30,.50);
      --text: #eef1f6;
      --text-soft: #9ca4b8;
      --text-muted: #5e6680;
      --border: rgba(255,255,255,.07);
      --border-strong: rgba(255,255,255,.14);
      --accent-1: #7090ff;
      --accent-2: #c084fc;
      --accent-3: #fb923c;
      --shadow-sm: 0 2px 12px rgba(0,0,0,.25);
      --shadow-md: 0 8px 32px rgba(0,0,0,.35);
      --shadow-lg: 0 20px 56px rgba(0,0,0,.50), 0 8px 24px rgba(112,144,255,.10);
    }

    /* ═══════════════ 基础 ═══════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.65;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      min-height: 100vh; transition: background .5s ease, color .3s ease;
      overflow-x: hidden;
      position: relative;
    }

    /* 动态渐变背景 */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: -1;
      background:
        radial-gradient(ellipse 80% 55% at 15% 10%, rgba(79,110,247,.18) 0%, transparent 58%),
        radial-gradient(ellipse 65% 50% at 85% 25%, rgba(168,85,247,.15) 0%, transparent 55%),
        radial-gradient(ellipse 75% 48% at 50% 85%, rgba(249,115,22,.12) 0%, transparent 52%);
      transition: opacity .5s ease;
    }
    [data-theme="dark"] body::before,
    [data-theme="dark"]::before {
      background:
        radial-gradient(ellipse 80% 55% at 15% 10%, rgba(112,144,255,.12) 0%, transparent 58%),
        radial-gradient(ellipse 65% 50% at 85% 25%, rgba(192,132,252,.09) 0%, transparent 55%),
        radial-gradient(ellipse 75% 48% at 50% 85%, rgba(251,146,60,.07) 0%, transparent 52%);
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    ::selection { background: rgba(79,110,247,.22); color: inherit; }

    /* ═══════════════ 顶部栏（极简） ═══════════════ */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 18px 28px;
      gap: 6px;
    }
    .theme-btn {
      width: 42px; height: 42px;
      display: grid; place-items: center;
      border-radius: 13px;
      color: var(--text-muted);
      background: var(--bg-elevated);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--border);
      transition: all var(--transition);
    }
    .theme-btn:hover { color: var(--text); transform: scale(1.05); box-shadow: var(--shadow-sm); }
    .theme-btn svg { width: 20px; height: 20px; }
    .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun { display: none; }
    [data-theme="dark"] .icon-moon { display: block; }

    /* ═══════════════ 主容器（居中） ═══════════════ */
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 64px;
    }

    /* ═══════════════ Hero 区域 ═══════════════ */
    .hero {
      text-align: center;
      margin-bottom: 44px;
      animation: heroIn .7s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes heroIn {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero h1 {
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 800;
      letter-spacing: -.03em;
      line-height: 1.12;
      margin-bottom: 14px;
      background: linear-gradient(135deg, var(--text) 0%, var(--text-soft) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      font-size: clamp(15px, 2.2vw, 17.5px);
      color: var(--text-soft);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ═══════════════ 卡片网格 ═══════════════ */
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: stretch;
      max-width: 900px;
      width: 100%;
    }

    /* ═══════════════ 大卡片（核心） ═══════════════ */
    .card {
      position: relative;
      flex: 1 1 340px;
      max-width: 420px;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      padding: 32px 30px 28px;
      background: var(--bg-card);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      transition: transform .38s cubic-bezier(.22,1,.36,1),
                  box-shadow .38s cubic-bezier(.22,1,.36,1),
                  border-color .38s ease;
      animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
    }
    .card:nth-child(2) { animation-delay: .12s; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* 卡片顶部光晕 */
    .card::before {
      content: "";
      position: absolute;
      top: -80px; left: 50%; transform: translateX(-50%);
      width: 260px; height: 160px;
      border-radius: 50%;
      filter: blur(44px);
      opacity: .45;
      pointer-events: none;
      transition: opacity .4s ease;
    }
    .card:nth-child(1)::before { background: var(--card-glow, var(--accent-1)); }
    .card:nth-child(2)::before { background: var(--card-glow, var(--accent-2)); }

    .card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-strong);
    }
    .card:hover::before { opacity: .65; }

    /* 角标 */
    .card-badge {
      position: absolute;
      top: 18px; right: 18px;
      padding: 4px 11px;
      font-size: 11px; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase;
      border-radius: 8px;
      background: var(--badge-bg, rgba(79,110,247,.12));
      color: var(--badge-color, var(--accent-1));
      border: 1px solid var(--badge-border, rgba(79,110,247,.2));
    }

    /* Logo 区域 */
    .card-logo-wrap {
      width: 76px; height: 76px;
      margin-bottom: 22px;
      border-radius: 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      display: grid; place-items: center;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform .3s ease, box-shadow .3s ease;
    }
    .card:hover .card-logo-wrap {
      transform: scale(1.06) rotate(-1.5deg);
      box-shadow: var(--shadow-md);
    }
    .card-logo-wrap img {
      width: 52px; height: 52px;
      object-fit: contain;
      border-radius: 10px;
    }
    .card-logo-icon {
      font-size: 36px; line-height: 1;
    }

    /* 文字区域 */
    .card-title {
      font-size: 22px; font-weight: 750;
      letter-spacing: -.02em;
      margin-bottom: 6px;
      line-height: 1.25;
    }
    .card-cat {
      font-size: 13px; font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 14px;
      display: inline-block;
      padding: 3px 0;
    }
    .card-desc {
      font-size: 14.5px;
      color: var(--text-soft);
      line-height: 1.65;
      margin-bottom: 20px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      line-clamp: 3;
      -webkit-box-orient: vertical;
      box-orient: vertical;
      overflow: hidden;
    }

    /* 标签 */
    .card-tags {
      display: flex; flex-wrap: wrap; gap: 7px;
      margin-top: auto;
    }
    .tag {
      padding: 5px 12px;
      font-size: 12px; font-weight: 500;
      color: var(--text-soft);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: all .25s ease;
    }
    .card:hover .tag {
      border-color: var(--border-strong);
      color: var(--text);
    }

    /* 底部 CTA */
    .card-footer {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-cta {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600;
      color: var(--accent-1);
      transition: all .25s ease;
    }
    .card:nth-child(2) .card-cta { color: var(--accent-2); }
    .card-cta svg {
      width: 18px; height: 18px;
      transition: transform .25s ease;
    }
    .card:hover .card-cta svg { transform: translateX(3px); }
    .card-cta:hover { opacity: .8; }

    .card-arrow {
      width: 34px; height: 34px;
      display: grid; place-items: center;
      border-radius: 11px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      transition: all .3s ease;
    }
    .card:hover .card-arrow {
      background: var(--card-glow, var(--accent-1));
      color: #fff;
      border-color: transparent;
      transform: translateX(3px);
    }
    .card:nth-child(2):hover .card-arrow {
      background: var(--card-glow, var(--accent-2));
    }
    .card-arrow svg { width: 16px; height: 16px; }


    /* ═══════════════ 加载骨架 ═══════════════ */
    .loading-skel {
      display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;
    }
    .skel {
      flex: 1 1 340px; max-width: 420px; height: 380px;
      border-radius: var(--radius-xl);
      background: var(--bg-card);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      position: relative; overflow: hidden;
    }
    .skel::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 30%, var(--bg-elevated) 50%, transparent 70%);
      animation: shimmer 1.6s infinite;
    }
    @keyframes shimmer { from { transform: translateX(-120%);} to { transform: translateX(120%);} }

    /* ═══════════════ 响应式 — 移动端一屏展示 ═══════════════ */
    @media (max-width: 768px) {
      /* 顶栏更薄 */
      .topbar { padding: 10px 14px; }
      .theme-btn { width: 36px; height: 36px; border-radius: 10px; }

      /* 主容器：紧凑布局，确保一屏内 */
      .page {
        padding: 16px 14px 24px;
        align-items: flex-start;
        padding-top: 58px;
        justify-content: flex-start;
        gap: 0;
      }

      /* Hero 大幅压缩 */
      .hero { margin-bottom: 18px; }
      .hero h1 {
        font-size: clamp(22px, 8vw, 30px);
        margin-bottom: 4px;
        line-height: 1.15;
      }
      .hero p {
        font-size: 13.5px;
        max-width: 100%;
        margin: 0 auto;
        line-height: 1.45;
      }

      /* 卡片间距收紧 */
      .grid { gap: 12px; }

      /* 卡片：紧凑版，高度控制在一屏内可放两张 */
      .card {
        flex: 1 1 100%; max-width: 100%;
        padding: 18px 16px 16px;
        border-radius: var(--radius-lg);
      }
      /* 光晕缩小避免溢出 */
      .card::before { top: -44px; width: 160px; height: 90px; filter: blur(32px); opacity: .35; }
      .card:hover::before { opacity: .5; }

      /* 角标缩小 */
      .card-badge { top: 12px; right: 12px; padding: 2px 8px; font-size: 9.5px; border-radius: 6px; }

      /* Logo 缩小 */
      .card-logo-wrap { width: 50px; height: 50px; border-radius: 13px; margin-bottom: 12px; }
      .card-logo-wrap img { width: 34px; height: 34px; border-radius: 8px; }
      .card-logo-icon { font-size: 26px; }

      /* 文字紧凑 */
      .card-title { font-size: 17px; margin-bottom: 2px; }
      .card-cat { font-size: 11.5px; margin-bottom: 8px; }
      .card-desc {
        -webkit-line-clamp: 2;
        line-clamp: 2;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 12px;
      }

      /* 标签紧凑 */
      .card-tags { gap: 5px; }
      .tag { padding: 3px 8px; font-size: 11px; border-radius: 999px; }

      /* 底部 CTA 紧凑 */
      .card-footer { margin-top: 12px; padding-top: 10px; }
      .card-cta { font-size: 12.5px; }
      .card-cta svg { width: 15px; height: 15px; }
      .card-arrow { width: 28px; height: 28px; border-radius: 9px; }
      .card-arrow svg { width: 14px; height: 14px; }
    }

    @media (max-width: 400px) {
      .page { padding: 12px 10px 20px; padding-top: 54px; }
      .hero { margin-bottom: 14px; }
      .hero h1 { font-size: 20px; }
      .hero p { font-size: 12.5px; }
      .grid { gap: 10px; }
      .card { padding: 15px 14px 14px; border-radius: var(--radius-md); }
      .card-logo-wrap { width: 44px; height: 44px; border-radius: 12px; margin-bottom: 10px; }
      .card-logo-wrap img { width: 30px; height: 30px; }
      .card-title { font-size: 16px; }
      .card-desc { font-size: 12.5px; -webkit-line-clamp: 2; line-clamp: 2; margin-bottom: 10px; }
      .tag { padding: 2px 7px; font-size: 10.5px; }
      .card-footer { margin-top: 10px; padding-top: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- 极简顶栏 -->
  <header class="topbar">
    <button class="theme-btn" id="themeToggle" aria-label="切换主题" title="切换深浅色">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
  </header>

  <!-- 主内容 -->
  <main class="page">

    <!-- Hero -->
    <section style="width:100%;max-width:900px;">
      <div class="hero">
        <h1 id="heroTitle">AI Hub Kit</h1>
        <p id="heroSubtitle">探索 AI 的无限可能，从这里开始。</p>
      </div>

      <!-- 卡片容器 -->
      <div id="container" class="loading-skel" aria-live="polite">
        <div class="skel"></div><div class="skel"></div>
      </div>

    </section>

  </main>

  <script>
    (function () {
      "use strict";

      const $ = (s) => document.querySelector(s);
      const container = $("#container");

      let DATA = { site: {}, products: [] };

      /* ──── 主题 ──── */
      const themeToggle = $("#themeToggle");
      const savedTheme = localStorage.getItem("nav-theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const initTheme = savedTheme || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", initTheme);

      themeToggle.addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme");
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("nav-theme", next);
      });

      /* ──── 工具函数 ──── */
      function esc(s) {
        return s.replace(/[&<>"']/g, function(c){
          return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
        });
      }

      function isImg(icon) {
        return /\.(png|jpe?g|svg|gif|webp|ico)$/i.test(icon);
      }

      /* ──── 渲染 ──── */
      function render() {
        if (!DATA.products.length) {
          container.className = ""; container.innerHTML =
            '<div style="text-align:center;padding:80px 20px;color:var(--text-muted)">'
            +'<div style="font-size:48px;margin-bottom:12px">📭</div>'
            +'<h3 style="color:var(--text-soft);margin-bottom:6px">暂无产品</h3>'
            +'<p style="font-size:14px">请在 products.json 中添加产品数据。</p></div>';
          return;
        }

        container.className = "grid";
        container.innerHTML = DATA.products.map(function(p, i) {
          var c = p.color || "#4f6ef7";
          var glow = p.glow || c;
          var iconHtml = isImg(p.icon)
            ? '<img src="' + esc(p.icon) + '" alt="" loading="lazy" />'
            : '<span class="card-logo-icon">' + esc(p.icon || "🔗") + '</span>';

          var badgeHtml = p.badge
            ? '<span class="card-badge" style="--badge-bg:' + esc(c) + '18;--badge-color:' + esc(c) + ';--badge-border:' + esc(c) + '30">' + esc(p.badge) + '</span>'
            : '';

          var tagsHtml = (p.tags || []).slice(0, 4).map(function(t) {
            return '<span class="tag">' + esc(t) + '</span>';
          }).join('');

          return (
            '<a class="card" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer"'
              + ' style="--card-glow:' + esc(glow) + '"'
              + ' aria-label="访问 ' + esc(p.name) + '">'
              + badgeHtml +
              '<div class="card-logo-wrap">' + iconHtml + '</div>' +
              '<h3 class="card-title">' + esc(p.name) + '</h3>' +
              '<div class="card-cat">' + esc(p.category || "") + '</div>' +
              '<p class="card-desc">' + esc(p.description || "") + '</p>' +
              '<div class="card-tags">' + tagsHtml + '</div>' +
              '<div class="card-footer">' +
                '<span class="card-cta">立即访问 '
                  + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'
                + '</span>' +
                '<span class="card-arrow">'
                  + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg>'
                + '</span>' +
              '</div>'
            + '</a>'
          );
        }).join("");
      }

      /* ──── 加载 ──── */
      async function init() {
        try {
          var res = await fetch("products.json", { cache: "no-cache" });
          if (!res.ok) throw new Error(res.status);
          DATA = await res.json();
        } catch(e) {
          container.className = ""; container.innerHTML =
            '<div style="text-align:center;padding:80px 24px;color:var(--text-muted);max-width:440px;margin:auto">'
            +'<div style="font-size:48px;margin-bottom:14px">⚙️</div>'
            +'<h3 style="color:var(--text-soft);margin-bottom:10px;font-size:18px">无法加载数据</h3>'
            +'<p style="font-size:14px;line-height:1.7">直接双击打开 HTML 时浏览器会阻止读取本地 JSON。<br><br>'
            +'请在项目目录运行本地服务：<br><br>'
            +'<code style="display:inline-block;padding:10px 18px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;font-size:13.5px">python3 -m http.server 8080</code>'
            +'<br><br>然后访问 <code>http://localhost:8080</code></p></div>';
          return;
        }

        // 应用站点配置
        var site = DATA.site || {};
        if (site.title) {
          document.title = site.title;
          $("#heroTitle").textContent = site.title;
        }
        if (site.subtitle) $("#heroSubtitle").textContent = site.subtitle;

        render();
      }

      init();
    })();
  </script>
</body>
</html>
